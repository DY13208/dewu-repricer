services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: repricer, POSTGRES_USER: repricer, POSTGRES_PASSWORD: "${DB_PASSWORD:-repricer}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U repricer"], interval: 5s, retries: 20 }
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/repricer
      REDIS_HOST: redis
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["18080:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["18081:80"]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
volumes: { pgdata: {}, redisdata: {} }
